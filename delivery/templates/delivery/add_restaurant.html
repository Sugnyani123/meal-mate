<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaturant</title>
</head>
<body>
    <form method = "POST" action=" {% url 'add_restaurant' %}">
        {% csrf_token %}

        <label for="name">RESTAURANT NAME:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="picture">PICTURE URL:</label>
        <input type="url" id="picture" name="picture"><br><br>

        <label for="cuisine">CUISINE:</label>
        <input type="text" id = "cuisine" name="cuisine" required><br><br>

        <label for="rating">Rating:</label>
        <input type="number" id="rating" name="rating" step="0.1" min="0" max="5" required> <br><br>

        <button type="submit">ADD RESTAURANT</button>
    </form>
</body>
</html>
